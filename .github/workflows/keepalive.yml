name: keepalive

# GitHub disables scheduled workflows in a public repository after 60 days without
# repository activity. A weekly heartbeat commit keeps the hourly collector alive.

on:
  schedule:
    - cron: "23 4 * * 1"   # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "chore: keepalive heartbeat"
          git push
